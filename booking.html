  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Header -->
  <header class="header">
    <div class="container nav-wrapper">
      <a href="index.html" class="logo">
        <span class="logo-sparkle">✧</span> Grand Smouha
      </a>

      <input type="checkbox" id="nav-toggle" class="nav-toggle">
      <label for="nav-toggle" class="nav-toggle-label">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="services.html">Expertise</a></li>
          <li><a href="booking.html" class="active">Reserve</a></li>
          <li><a href="contact.html">Visit Us</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section" style="padding-top: 60px;">
      <div class="container" style="max-width: 680px; margin: 0 auto;">
        <div class="glass-card">
          <h2 style="text-align: center; margin-bottom: 12px;">Reserve Your <span class="gold-text">Visit</span></h2>
          <p style="text-align: center; color: var(--text-muted); font-weight: 300; margin-bottom: 35px;">Select your treatment and preferred time. Our team will contact you to confirm.</p>
          
          <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Reservation submitted successfully. Our concierge will contact you shortly.');">
            <div class="form-group">
              <label for="fullname">Full Name</label>
              <input type="text" id="fullname" class="form-control" placeholder="e.g. Dr. Ahmed Hassan" required>
            </div>

            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" class="form-control" placeholder="+20 100 000 0000" required>
            </div>

            <div class="form-group">
              <label for="service">Desired Treatment</label>
              <select id="service" class="form-control" required>
                <option value="" disabled selected>Select a treatment</option>
                <option value="cleaning">Aesthetic Cleaning (Standard)</option>
                <option value="whitening">Laser Whitening (Premium)</option>
                <option value="implants">Dental Implants (Advanced)</option>
                <option value="consultation">General Consultation</option>
              </select>
            </div>

            <div class="form-group">
              <label for="date">Preferred Date</label>
              <input type="date" id="date" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">Confirm Reservation Request</button>
          </form>

        </div>
      </div>
    </section>
  </main>
